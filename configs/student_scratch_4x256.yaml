# Narrow student trained from scratch: 4 layers x 256 hidden, UniXcoder tokenizer,
# token embeddings initialized from the top-256 principal components of UniXcoder's embeddings.
name: student_scratch_4x256
model:
  init: scratch
  scratch_base: microsoft/unixcoder-base
  tokenizer: microsoft/unixcoder-base
  scratch:
    hidden_size: 256
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 1024
  embed_init: pca:microsoft/unixcoder-base
data:
  normalize: single_line
  max_length: 512
  truncation: head
train:
  epochs: 8
  batch_size: 64
  lr: 3.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  seed: 42
  bf16: true
  eval_every_epochs: 1.0
  patience: 3
