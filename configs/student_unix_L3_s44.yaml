# Seed repeat of student_unix_L3 (seed 44).
name: student_unix_L3_s44
model:
  init: microsoft/unixcoder-base
  num_layers: 3
  layer_selection: first
data:
  normalize: single_line
  max_length: 512
  truncation: head
train:
  epochs: 4
  batch_size: 32
  lr: 5.0e-05
  warmup_ratio: 0.06
  weight_decay: 0.01
  seed: 44
  bf16: true
  eval_every_epochs: 0.5
  patience: 2
